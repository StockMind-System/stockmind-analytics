[project]
name = "stockmind-analytics"
version = "0.1.0"
description = "API de analitica y prediccion de demanda para StockMind"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.116.0,<1.0.0",
    "joblib>=1.5.0,<2.0.0",
    "pandas>=2.3.0,<4.0.0",
    "scikit-learn>=1.7.0,<2.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
    "xgboost>=3.0.0,<4.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "pytest>=8.4.0,<10.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

